apiVersion: apps/v1
kind: Deployment
metadata:
  name: stripe-cli
  labels:
    app: stripe-cli
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stripe-cli
  template:
    metadata:
      labels:
        app: stripe-cli
    spec:
      containers:
        - name: stripe-cli
          image: stripe/stripe-cli:v1.43.7
          args:
            - listen
            - --forward-to
            - http://backend:5000/api/webhook
          env:
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_DEVICE_NAME
              value: maison-aura-aks
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

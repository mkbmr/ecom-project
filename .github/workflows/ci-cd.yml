name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.MD'

env:
  ACR_NAME: maisonauraacr2
  ACR_LOGIN_SERVER: maisonauraacr2.azurecr.io
  RESOURCE_GROUP: maisonaura-rg2
  AKS_CLUSTER: maisonaura2-aks

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm ci
          npx eslint src

      - name: Syntax-check backend
        working-directory: backend
        run: |
          node --check server.js
          node --check db.js

  # Security gate 1: scan npm dependencies for known CVEs.
  # Fails the pipeline if anything HIGH or CRITICAL is found.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  build-and-push:
    needs: [lint, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name $ACR_NAME

      - name: Build backend image
        run: docker build -t $ACR_LOGIN_SERVER/backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }} \
            -t $ACR_LOGIN_SERVER/frontend:${{ github.sha }} ./frontend

      # Security gate 2: scan the built images (base OS + everything inside)
      # for HIGH/CRITICAL CVEs. Images are only pushed if the scans pass.
      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push backend image
        run: docker push $ACR_LOGIN_SERVER/backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push $ACR_LOGIN_SERVER/frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group $RESOURCE_GROUP --name $AKS_CLUSTER

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Roll out new images
        run: |
          kubectl set image deployment/backend  backend=$ACR_LOGIN_SERVER/backend:${{ github.sha }}
          kubectl set image deployment/frontend frontend=$ACR_LOGIN_SERVER/frontend:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend  --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s
